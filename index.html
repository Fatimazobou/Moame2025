<!DOCTYPE html><html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎉 هدية لمحمد 🎉</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(#e0f7fa, #b3e5fc);
      color: #01579b;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #0277bd;
    }
    .question {
      margin: 30px auto;
      padding: 20px;
      border-radius: 20px;
      background-color: #ffffffcc;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      max-width: 600px;
    }
    button {
      background-color: #0288d1;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0277bd;
    }
    .hidden {
      display: none;
    }
    #progress {
      height: 20px;
      background-color: #b3e5fc;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0288d1;
      transition: width 0.3s;
    }
  </style>
</head>
<body><h1>🎁 مفاجأة عيد ميلاد محمد 🎁</h1>
<button onclick="startGame()">🎉 ابدأ الهدية 🎉</button><div id="game" class="hidden">
  <div id="question-container" class="question"></div>
  <div id="answers"></div>
  <div id="progress">
    <div id="progress-bar"></div>
  </div>
</div><div id="end-message" class="hidden">
  <h2>🎂 عيد ميلاد سعيد محمد! 🎂</h2>
  <p>🎈 عمرك اليوم 21 سنة، ولكن في قلبي من زمان كبير! 🎈</p>
  <p>💙 أحبك يا فاروقي، وكل عام وأنت سندي وفرحي 💙</p>
  <p>هدية فطومة، من القلب ❤️</p>
</div><audio id="music" preload="auto">
  <source src="https://github.com/yourusername/musicrepo/raw/main/happy-birthday.mp3" type="audio/mpeg">
</audio><script>
const questions = [
  { q: "ما هو لون محمد المفضل؟", options: ["الأزرق", "الأحمر", "الأخضر"], answer: "الأزرق" },
  { q: "كم عمر محمد اليوم؟", options: ["20", "21", "22"], answer: "21" },
  { q: "من هي فطومة؟", options: ["جارته؟", "حبيبته؟", "مديرته؟"], answer: "حبيبته؟" },
  { q: "في أي يوم يصادف عيد ميلاده هذا العام؟", options: ["الجمعة", "السبت", "الأحد"], answer: "الجمعة" },
  { q: "ماذا تقول له فطومة اليوم؟", options: ["كل عام وأنت بخير", "روح من هنا", "زيد كبر"] , answer: "كل عام وأنت بخير" },
  { q: "أين تراه فطومة في المستقبل؟", options: ["في قلبي دايمًا", "في باريس", "في المترو"], answer: "في قلبي دايمًا" },
  { q: "ما اسم محمد الكامل؟", options: ["محمد بن فطومة", "محمد فاروق", "محمد شاروخان"], answer: "محمد فاروق" },
  { q: "ماذا تحب فيه فطومة؟", options: ["كل شيء", "ضحكته", "صوته"], answer: "كل شيء" },
  { q: "من أرسل له هذه اللعبة؟", options: ["فطومة", "أخته", "قوقل"] , answer: "فطومة" },
  { q: "ما الهدية الحقيقية؟", options: ["اللعبة", "الكلام", "الحب"], answer: "الحب" },
];

let current = 0;
let score = 0;

function startGame() {
  document.querySelector('button').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('music').play();
  showQuestion();
}

function showQuestion() {
  let q = questions[current];
  document.getElementById('question-container').innerText = q.q;
  document.getElementById('answers').innerHTML = '';
  q.options.forEach(opt => {
    let btn = document.createElement('button');
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt);
    document.getElementById('answers').appendChild(btn);
  });
  updateProgress();
}

function checkAnswer(opt) {
  if (opt === questions[current].answer) score++;
  current++;
  if (current < questions.length) showQuestion();
  else endGame();
}

function updateProgress() {
  let percent = ((current) / questions.length) * 100;
  document.getElementById('progress-bar').style.width = percent + '%';
}

function endGame() {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('end-message').classList.remove('hidden');
  document.getElementById('end-message').innerHTML += `<p>علامتك: ${score} / ${questions.length}</p>`;
}
</script></body>
</html>
