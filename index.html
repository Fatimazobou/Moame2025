<!DOCTYPE html><html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>هدية عيد ميلاد محمد 🎉</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(to bottom right, #cbe4f9, #e2efff);
      color: #222;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #005baa;
      margin-bottom: 10px;
    }
    .question {
      font-size: 20px;
      margin-bottom: 20px;
    }
    .options button {
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      margin: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 16px;
    }
    .options button:hover {
      background-color: #0056b3;
    }
    .progress-bar {
      height: 20px;
      background-color: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress {
      height: 100%;
      background-color: #00b4d8;
      width: 0%;
    }
    #result {
      font-size: 24px;
      margin-top: 20px;
      color: #007f5f;
    }
    #startBtn {
      font-size: 18px;
      background-color: #f77f00;
      padding: 12px 25px;
      border: none;
      color: white;
      border-radius: 15px;
      margin-top: 30px;
      cursor: pointer;
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 مفاجأة عيد ميلادك يا محمد 🎂</h1>
    <p>من فطومة ❤️</p><button id="startBtn">ابدأ الهدية</button>

<div id="quiz" style="display:none">
  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
</div>

<div id="result"></div>

<audio id="birthdayAudio" autoplay>
  <source src="https://github.com/yourusername/musicrepo/raw/main/happy-birthday.mp3" type="audio/mpeg">
</audio>

  </div>  <script>
    const questions = [
      { q: "شنو أول كلمة قلتها لي؟", options: ["سلام", "واش راكي؟", "أهلاً", "أنا محمد"], correct: 0 },
      { q: "وش لونك المفضل؟", options: ["أزرق", "أخضر", "أحمر", "أسود"], correct: 0 },
      { q: "تاريخ أول مرة حكينا؟", options: ["2023", "2024", "2022", "2021"], correct: 1 },
      { q: "شنو ناديتني في أول مرة؟", options: ["زهرة", "فطومة", "حبيبتي", "نعم؟"], correct: 1 },
      { q: "وش يفرحك أكثر؟", options: ["قهوة", "أنا 😜", "كرة القدم", "النوم"], correct: 1 },
      { q: "عيد ميلادك يوافق؟", options: ["عيد الأضحى", "رمضان", "المولد النبوي", "لاشيء"], correct: 0 },
      { q: "تحب النكت؟", options: ["نعم", "لا", "حسب النكتة", "مش دايمًا"], correct: 0 },
      { q: "أكثر شي تحب تاكلو؟", options: ["كسكس", "بيتزا", "مقرونة", "شاورما"], correct: 2 },
      { q: "تحب اللون الأزرق؟", options: ["أكيد", "شوي", "لا", "ما أعرف"], correct: 0 },
      { q: "وش شعورك لما تسمع صوتي؟", options: ["يرتاح قلبي ❤️", "عادي", "تقلق 😆", "أخاف"], correct: 0 },
      { q: "إذا حكينا أقل من يوم، تحس؟", options: ["ناقص شيء", "مرتاح", "ولا شي", "نص نص"], correct: 0 },
      { q: "أقرب شيء ليك مني؟", options: ["الكلام", "النية", "الاهتمام", "الكل"], correct: 3 },
      { q: "كم مرة ضحكت بسببي؟", options: ["كل يوم", "مرات قليلة", "ولا مرة 😒", "ما نحسبش"], correct: 0 },
      { q: "عيد ميلادك هذا أي سنة؟", options: ["21", "22", "23", "20"], correct: 0 },
      { q: "هل تحب الألعاب؟", options: ["أكيد", "لا", "أحيانا", "بزاف"], correct: 3 },
      { q: "وش تحب تسمع مني؟", options: ["نحبك ❤️", "تصبح على خير", "اسمي فقط", "فطومة"], correct: 0 },
      { q: "أجمل لحظة بيننا؟", options: ["أول مكالمة", "كل لحظة", "أول رسالة", "كلهم"], correct: 3 },
      { q: "شنو لون عيونك؟", options: ["أسود", "بني", "أزرق", "رمادي"], correct: 1 },
      { q: "وش رايك في هديتي؟", options: ["روعة!", "بسيطة بس حلوة", "كنت متوقع أحسن", "لا تعليق"], correct: 0 },
      { q: "شنو تحب تقوليك اليوم؟", options: ["نحبك ❤️", "عيد ميلاد سعيد 🎂", "انت قلبي", "كلشي 😍"], correct: 3 },
    ];

    let current = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");
    const progressEl = document.getElementById("progress");
    const quizEl = document.getElementById("quiz");
    const audio = document.getElementById("birthdayAudio");

    document.getElementById("startBtn").onclick = () => {
      document.getElementById("startBtn").style.display = "none";
      quizEl.style.display = "block";
      audio.play();
      showQuestion();
    };

    function showQuestion() {
      if (current >= questions.length) {
        showResult();
        return;
      }

      const q = questions[current];
      questionEl.textContent = q.q;
      optionsEl.innerHTML = "";

      q.options.forEach((option, idx) => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => {
          if (idx === q.correct) score++;
          current++;
          updateProgress();
          showQuestion();
        };
        optionsEl.appendChild(btn);
      });
    }

    function updateProgress() {
      const percent = Math.floor((current / questions.length) * 100);
      progressEl.style.width = percent + "%";
    }

    function showResult() {
      quizEl.style.display = "none";
      resultEl.innerHTML = `<p>🎊 محمد 🎊<br> جبت ${score} من ${questions.length}!<br><br>
        عيد ميلاد سعيد 21 🎂، تبقى ديما في قلبي ❤️<br>
        محبة من فطومة 😘</p>`;
    }
  </script></body>
</html>
