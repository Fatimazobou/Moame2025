<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عيد ميلاد سعيد محمد 🎉</title>
  <style>
    body {
      background: linear-gradient(to bottom, #cce7ff, #e6f2ff);
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .profile-pic {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #007acc;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    header {
      background-color: #007acc;
      color: white;
      padding: 15px;
      font-size: 2em;
    }

    .progress {
      margin: 15px auto;
      font-size: 1.2em;
      color: #003d66;
    }

    .question-box {
      background-color: #e0f0ff;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 1.5em;
    }

    .options label {
      display: block;
      background: white;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      max-width: none;
      cursor: pointer;
      border: 2px solid #3399ff;
      transition: 0.3s;
      font-size: 1.3em;
    }

    .options label:hover {
      background-color: #d0ebff;
    }

    .result {
      font-size: 1.4em;
      color: #004466;
      margin: 30px;
    }
  </style>
</head>
<body>

  <div class="profile-pic">
    <img src="IMG_٢٠٢٥٠٦٠٥_٢٢٢٣١٩.jpg" alt="محمد">
  </div>

  <header>🎂 عيد ميلاد سعيد محمد 🎂</header>

  <div class="progress" id="progress">السؤال 1 من 20</div>
  <div class="question-box" id="question-box"></div>
  <div class="result" id="result"></div>

  <script>
    const questions = [
      { q: "واش الحاجة اللي مايخبوهاش العشاق؟", options: ["المشاعر", "الكذب", "الهدايا"], correct: 0 },
      { q: "واش يدير العاشق كي يسمع صوت محبوبو؟", options: ["يفرح", "يبكي", "يقلق"], correct: 0 },
      { q: "شكون يكون أغلى من الناس عند العاشق؟", options: ["أهلو", "محبوبو", "صاحب طفولتو"], correct: 1 },
      { q: "في الحب، القلب يهدر ولا العقل؟", options: ["القلب", "العقل", "زوج"], correct: 0 },
      { q: "كي تشوف محبوبك، وش تحس؟", options: ["بالراحة", "بالتوتر", "بالخوف"], correct: 0 },
      { q: "وش أقوى كلمة فالحب؟", options: ["نحبك", "نشتاقلك", "مانقدرش نعيش بلا بيك"], correct: 2 },
      { q: "الحب واش يبدل في الشخص؟", options: ["يحليه", "يقلقه", "يضعف ثقتو"], correct: 0 },
      { q: "كي يغيب محبوبك، وش تولي؟", options: ["تخمم فيه", "تنسا", "تخرج تتونس"], correct: 0 },
      { q: "وش الحاجة اللي تزيد الحب؟", options: ["الاهتمام", "الغيرة", "الرسائل"], correct: 0 },
      { q: "كي تعيط محبوبك، وش أول كلمة تقولها؟", options: ["سلام", "حبي", "اسم محبوبك"], correct: 1 },
      { q: "الحب واش هو فالحقيقة؟", options: ["إحساس", "تعلق", "هوس"], correct: 0 },
      { q: "كي تكون زعفان، وش يديرلك محبوبك؟", options: ["يراضيك", "يخليك", "يزعف معاك"], correct: 0 },
      { q: "وش يجرح فالحب؟", options: ["الخيانة", "الإهمال", "النسيان"], correct: 0 },
      { q: "كي تكون وحدك، واش يدور فبالك؟", options: ["محبوبك", "الهموم", "النجاح"], correct: 0 },
      { q: "أغلى لحظة في الحب؟", options: ["أول اعتراف", "أول نظرة", "أول عناق"], correct: 2 },
      { q: "وش أحسن هدية فالحب؟", options: ["الكلمة الصادقة", "العطر", "الدبدوب"], correct: 0 },
      { q: "وش أقرب طريق للقلب؟", options: ["الاحترام", "الجمال", "الفلوس"], correct: 0 },
      { q: "وش يدير العاشق قبل ما ينعس؟", options: ["يتفكر محبوبو", "يشوف صور", "يبكي"], correct: 0 },
      { q: "الحب واش يعلمنا؟", options: ["الصبر", "الأنانية", "الغرور"], correct: 0 },
      { q: "آخر كلمة تقولها لمحبوبك؟", options: ["نحبك", "ما تخلينيش", "ديما معايا"], correct: 0 }
    ];

    let current = 0;
    let score = 0;
    const qbox = document.getElementById("question-box");
    const progress = document.getElementById("progress");
    const result = document.getElementById("result");

    function loadQuestion() {
      if (current >= questions.length) {
        showResult();
        return;
      }
      progress.textContent = `السؤال ${current + 1} من ${questions.length}`;
      const q = questions[current];
      let html = `<div>${q.q}</div><div class="options">`;
      q.options.forEach((opt, i) => {
        html += `<label onclick="checkAnswer(${i})">${opt}</label>`;
      });
      html += `</div>`;
      qbox.innerHTML = html;
    }

    function checkAnswer(index) {
      const correct = questions[current].correct;
      const labels = document.querySelectorAll(".options label");
      labels.forEach((label, i) => {
        label.style.backgroundColor = i === correct ? '#b2f2bb' : (i === index ? '#ffcccc' : 'white');
        label.onclick = null;
      });
      if (index === correct) score++;
      setTimeout(() => {
        current++;
        loadQuestion();
      }, 1000);
    }

    function showResult() {
      qbox.style.display = "none";
      progress.style.display = "none";
      let message = score >= 10 ? "🎉 مبروك ربحت 🎉" : "💔 ما ربحتش كامل 💔";
      result.innerHTML = `
        ${message}<br>
        نتيجتك: ${score} / ${questions.length}<br><br>
        ❤️ بصح مهما كانت نتيجتك، راك ربحت قلبي يا محمد ❤️<br>
        🎂 عيد ميلاد سعيد وربي يدوم محبتنا 🎂
      `;
    }

    loadQuestion();
  </script>

</body>
</html>
