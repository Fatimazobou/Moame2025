<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>عيد ميلاد سعيد محمد 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      direction: rtl;
      font-family: 'Arial', sans-serif;
      background-color: #e0f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #00796b;
      margin-bottom: 10px;
    }

    h1 {
      color: #00796b;
      margin: 10px 0;
    }

    p {
      color: #004d40;
      font-size: 18px;
      margin: 5px 0 20px;
    }

    button {
      background-color: #00796b;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    #quiz,
    #end {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .option {
      display: block;
      background-color: #b2dfdb;
      padding: 10px;
      margin: 10px auto;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .option:hover {
      background-color: #80cbc4;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/120" alt="محمد">
    <h1>عيد ميلاد سعيد محمد 🎉</h1>
    <p>من عند فطومة ❤️</p>
    <button onclick="startQuiz()">ابدأ اللعبة</button>

    <div id="quiz" class="hidden">
      <h2 id="questionText"></h2>
      <div id="options"></div>
    </div>

    <div id="end" class="hidden">
      <h2>مبروك يا محمد 🎉</h2>
      <p id="scoreText"></p>
      <p>ربي يحفظك ونبقى نحبك ديما 💙</p>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "شنو أكثر حاجة تحبها في فطومة؟",
        options: ["ضحكتها", "عيونها", "قلبها", "كلشي"],
        answer: "كلشي"
      },
      {
        question: "وين تحب تدّي فطومة في عطلة؟",
        options: ["تركيا", "باريس", "الجزائر العاصمة", "عنابة"],
        answer: "باريس"
      },
      {
        question: "فطومة تحب؟",
        options: ["الشوكولا", "القهوة", "أنت", "الهدوء"],
        answer: "أنت"
      },
      // زيد أسئلة أخرى حسب الحاجة
    ];

    let currentQuestion = 0;
    let score = 0;

    function startQuiz() {
      document.querySelector("button").style.display = "none";
      document.getElementById("quiz").classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("questionText").innerText = q.question;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      q.options.forEach(option => {
        const btn = document.createElement("div");
        btn.className = "option";
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(answer) {
      if (answer === questions[currentQuestion].answer) score++;
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("end").classList.remove("hidden");
        document.getElementById("scoreText").innerText = `جاوبت صحيح على ${score} من ${questions.length} أسئلة ❤️`;
      }
    }
  </script>
</body>
</html>
