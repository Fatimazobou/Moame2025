<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عيد ميلاد سعيد محمد 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #cce6ff, #e6f2ff);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .quiz-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      padding: 30px;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    h1 {
      color: #0059b3;
    }
    .question {
      font-size: 20px;
      margin-bottom: 20px;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice {
      background: #e6f0ff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }
    .choice:hover {
      background: #b3d1ff;
    }
    #next-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #3399ff;
      color: white;
      cursor: pointer;
    }
    #result {
      font-size: 20px;
      margin-top: 20px;
      color: #0073e6;
    }
    .counter {
      font-size: 16px;
      margin-bottom: 10px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>🎉 عيد ميلاد سعيد محمد 🎂</h1>
    <div class="counter" id="counter"></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <button id="next-btn" onclick="nextQuestion()">التالي</button>
    <div id="result"></div>
  </div>  <audio id="bg-music" autoplay loop>
    <source src="https://github.com/username/music-folder/raw/main/happy_birthday_no_music.mp3" type="audio/mp3" />
  </audio>  <script>
    const questions = [
      {
        question: "ما أكثر شيء تحبه فطومة في محمد؟",
        choices: ["صوته", "ضحكته", "قلبه", "كله"],
        answer: "كله"
      },
      {
        question: "أين سيكون أول مكان نلتقي فيه بإذن الله؟",
        choices: ["الحديقة", "المسجد", "شاطئ البحر", "أي مكان معك جميل"],
        answer: "أي مكان معك جميل"
      },
      {
        question: "كيف تحتفل فطومة بهذا اليوم؟",
        choices: ["بأغنية", "بهدية رقمية", "بدعاء من القلب", "كل ما سبق"],
        answer: "كل ما سبق"
      },
      {
        question: "ماذا تقول فطومة لمحمد في عيده؟",
        choices: ["عيد سعيد", "أنت نور حياتي", "كل عام وأنت بخير", "كلهم مع بعض"],
        answer: "كلهم مع بعض"
      },
      {
        question: "ما لون محمد المفضل؟",
        choices: ["الأحمر", "الأزرق", "الأخضر", "الأسود"],
        answer: "الأزرق"
      },
      {
        question: "كم عمر محمد اليوم؟",
        choices: ["20", "21", "22", "19"],
        answer: "21"
      },
      {
        question: "ما هو شعار حبنا؟",
        choices: ["مع بعض رغم البعد", "حبنا كبير", "نتحدى العالم", "كل ما سبق"],
        answer: "كل ما سبق"
      },
      {
        question: "أكثر لحظة تتخيلها فطومة مع محمد؟",
        choices: ["ضحكة معًا", "صلاة جمعة", "نزهة في البحر", "كلها"],
        answer: "كلها"
      },
      {
        question: "فطومة تقول: محمد هو...",
        choices: ["نصف القلب", "كل الحياة", "فرحي", "الكل"],
        answer: "الكل"
      },
      {
        question: "رسالة فطومة لمحمد اليوم؟",
        choices: ["أحبك", "اشتقتلك", "أنت عيدي", "كلها"],
        answer: "كلها"
      },
      // يمكنك إضافة 10 أسئلة أخرى بنفس النمط لبلوغ 20 سؤالاً
    ];

    let currentQuestion = 0;
    let score = 0;

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").innerText = q.question;
      document.getElementById("counter").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;

      const choicesDiv = document.getElementById("choices");
      choicesDiv.innerHTML = "";
      q.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.innerText = choice;
        btn.classList.add("choice");
        btn.onclick = () => checkAnswer(choice);
        choicesDiv.appendChild(btn);
      });
    }

    function checkAnswer(choice) {
      const correct = questions[currentQuestion].answer;
      if (choice === correct) {
        score++;
      }
      document.querySelectorAll(".choice").forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correct) {
          btn.style.backgroundColor = "#c1f0c1";
        } else if (btn.innerText === choice) {
          btn.style.backgroundColor = "#ffb3b3";
        }
      });
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        document.getElementById("question").innerText = "انتهت اللعبة!";
        document.getElementById("choices").innerHTML = "";
        document.getElementById("counter").innerText = "✔️";
        document.getElementById("result").innerText = `🎁 هديتك: حب كبير من فطومة لا ينوصف 🌸\nحصلت على ${score} من ${questions.length}`;
        document.getElementById("next-btn").style.display = "none";
      }
    }

    showQuestion();
  </script></body>
</html>
