<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>عيد ميلاد سعيد محمد 🎉</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #003366;
      padding: 20px;
    }
    .container {
      display: none;
      margin-top: 20px;
    }
    .question {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .options button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 80%;
    }
    .options button:hover {
      background-color: #005f99;
    }
    .result {
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
      color: #006699;
    }
    .start-btn {
      background-color: #004d80;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }
    .start-btn:hover {
      background-color: #003366;
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <h1>🎂 مفاجأة عيد ميلاد محمد 🎂</h1>
  <p>من عند فطومة الزهراء 💙</p>
  <button class="start-btn" onclick="startGame()">ابدأ الهدية 🎁</button>

  <audio id="bgMusic" autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/07/30/audio_3f62c715c5.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="gameContainer">
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div id="progress"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    const questions = [
      { q: "في أي يوم وُلد محمد؟", options: ["عيد الأضحى", "عيد الفطر", "يوم دراسته"], correct: 0 },
      { q: "ما لون محمد المفضل؟", options: ["أخضر", "أزرق", "أحمر"], correct: 1 },
      { q: "كم عمر محمد الآن؟", options: ["20", "21", "22"], correct: 1 },
      { q: "أكمل: محمد و ____", options: ["زهرة", "فطومة", "نجمة"], correct: 1 },
      { q: "أقرب شيء لقلب محمد؟", options: ["البيتزا", "فطومة", "النوم"], correct: 1 },
      { q: "ما هو الحيوان المفضل لمحمد؟", options: ["قط", "كلب", "أسد"], correct: 2 },
      { q: "هل محمد يحب المفاجآت؟", options: ["نعم", "لا", "يخاف"], correct: 0 },
      { q: "عيد ميلاد بدون فطومة هو؟", options: ["ممل", "عادي", "احتفال"], correct: 0 },
      { q: "نكتة: لماذا الكمبيوتر بردان؟", options: ["لأنه في ثلاجة", "لأن فيه نوافذ", "لأنه مريض"], correct: 1 },
      { q: "ما الشيء الذي لا يأكله محمد أبداً؟", options: ["فطائر", "بيض", "فطومة"], correct: 2 },
      { q: "أين يحب محمد أن يذهب؟", options: ["القمر", "شاطئ", "قلب فطومة"], correct: 2 },
      { q: "أكمل: فطومة هي ____", options: ["أخته", "روحه", "جارته"], correct: 1 },
      { q: "كم مرة تقول فطومة لمحمد \"نحبك\" في اليوم؟", options: ["1", "100", "ما تحسبش"], correct: 2 },
      { q: "هل محمد ذكي؟", options: ["جداً", "شوية", "يحتاج قهوة"], correct: 0 },
      { q: "ماذا تقول فطومة الآن؟", options: ["كل عام وأنت بخير", "أحبك", "كلاهما"], correct: 2 }
    ];

    let currentQuestion = 0;
    let score = 0;

    function startGame() {
      document.querySelector(".start-btn").style.display = "none";
      document.getElementById("gameContainer").style.display = "block";
      document.getElementById("bgMusic").play();
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").textContent = q.q;
      document.getElementById("options").innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(i);
        document.getElementById("options").appendChild(btn);
      });
      document.getElementById("progress").textContent = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    }

    function checkAnswer(i) {
      if (i === questions[currentQuestion].correct) score++;
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("question").textContent = "";
      document.getElementById("options").innerHTML = "";
      document.getElementById("progress").textContent = "";
      document.getElementById("result").innerHTML =
        `🥳 محمد، جبت ${score} من ${questions.length}<br><br>🎉 عيد ميلاد سعيد 🎂<br>💖 نحبك بزاف، فطومة الزهراء 💌`;
    }
  </script>
</body>
</html>
