<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>عيد ميلاد سعيد محمد 🎉</title>
  <style>
    body {
      background-color: #e3f2fd;
      font-family: 'Tahoma', sans-serif;
      text-align: center;
      direction: rtl;
      padding: 0;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 0 15px #90caf9;
      margin-top: 20px;
    }
    img {
      width: 150px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    button {
      background-color: #2196f3;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #1976d2;
    }
    .hidden { display: none; }
    .question-count {
      font-weight: bold;
      color: #1565c0;
    }
    #options button {
      display: block;
      width: 100%;
      margin: 10px auto;
    }
    .result {
      margin-top: 10px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="IMG_٢٠٢٥٠٦٠٥_٢٢٠٠٠٨.jpg" alt="صورة محمد">
  <h1>عيد ميلاد سعيد يا محمد 🎂💙</h1>
  <p>من عند فطومة ❤️</p>
  <button onclick="startQuiz()">ابدأ اللعبة</button>

  <div id="quiz" class="hidden">
    <p class="question-count" id="counter"></p>
    <p id="question"></p>
    <div id="options"></div>
    <p class="result" id="result"></p>
  </div>

  <div id="end" class="hidden">
    <h2>🎉 مبروك يا محمد 🎉</h2>
    <p id="score"></p>
    <p>هذه هديتي لعيد ميلادك الـ21 🎁</p>
    <p>ربي يحفظك ونبقى نحبك ديما 💙</p>
  </div>
</div>

<script>
const questions = [
  {
    question: "ما هو الشيء الذي لا يستطيع العاشق إخفاءه؟",
    options: ["الغيرة", "الابتسامة", "الحب", "الدموع"],
    answer: "الحب"
  },
  {
    question: "ما هو أكثر شيء يجعل العلاقة أقوى؟",
    options: ["الهدايا", "المال", "الصدق", "السفر"],
    answer: "الصدق"
  },
  {
    question: "إذا قلتلك أحبك، ماذا تقول؟",
    options: ["أنا أكثر", "أنا أحبك أكثر", "أنا أذوب", "ولا كلمة"],
    answer: "أنا أحبك أكثر"
  },
  {
    question: "أين يلتقي العشاق بدون ميعاد؟",
    options: ["في الحلم", "في الحقيقة", "في القلب", "في السوق"],
    answer: "في القلب"
  },
  {
    question: "أكثر شيء يزعج فطومة لما محمد يفعله؟",
    options: ["ينسى الرسائل", "ما يضحكش", "ما يردش", "ما يقولش صباح الخير"],
    answer: "ما يردش"
  },
  {
    question: "ما هو الحلم المشترك بيننا؟",
    options: ["السفر", "الزواج", "بيت صغير", "العيش سوا"],
    answer: "العيش سوا"
  },
  {
    question: "كم مرة قلتلك نحبك؟",
    options: ["100", "ألف", "مليون", "لا تحصى"],
    answer: "لا تحصى"
  },
  {
    question: "أول كلمة خطرتلك كي شفتني؟",
    options: ["ملاك", "جميلة", "روحي", "غريبة"],
    answer: "روحي"
  },
  {
    question: "من فينا أكثر رومنسية؟",
    options: ["محمد", "فطومة", "الاثنين", "ما نعرفش"],
    answer: "فطومة"
  },
  {
    question: "هل الحب يُقاس بالكلمات؟",
    options: ["لا", "أحيانا", "نعم", "بالأفعال فقط"],
    answer: "لا"
  },
  {
    question: "أين يكون الحب الحقيقي؟",
    options: ["في العقل", "في القلب", "في الخيال", "في الوقت"],
    answer: "في القلب"
  },
  {
    question: "هل أشتاق لك الآن؟",
    options: ["أكيد", "ربما", "ما نظنش", "لا"],
    answer: "أكيد"
  },
  {
    question: "هل أحلامنا رح تتحقق؟",
    options: ["نعم", "ان شاء الله", "أكيد", "بالصبر"],
    answer: "أكيد"
  },
  {
    question: "أكثر حاجة نحبها فيك؟",
    options: ["عيونك", "ضحكتك", "صراحتك", "كلك"],
    answer: "كلك"
  },
  {
    question: "هل الحب لعبة؟",
    options: ["لا", "أحيانا", "نعم", "نعم بس حلوة"],
    answer: "لا"
  },
  {
    question: "نقطة ضعف العشاق؟",
    options: ["الفراق", "الخيانة", "الغيرة", "الشوق"],
    answer: "الفراق"
  },
  {
    question: "أين أهرب لما أشتاقلك؟",
    options: ["صورتك", "ذاكرتي", "قلبي", "رسائلك"],
    answer: "رسائلك"
  },
  {
    question: "كيف أعبّر لك عن الحب؟",
    options: ["بالكلام", "بالأفعال", "بالرسائل", "كل هذا"],
    answer: "كل هذا"
  },
  {
    question: "شو يعني محمد عندي؟",
    options: ["حب", "حياة", "هوائي", "كل شيء"],
    answer: "كل شيء"
  },
  {
    question: "هل الحب أقوى من الوقت؟",
    options: ["أكيد", "لا", "ربما", "إذا صبرنا"],
    answer: "أكيد"
  }
];

let current = 0, score = 0;

function startQuiz() {
  document.querySelector('button').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('counter').textContent = `السؤال ${current + 1} من ${questions.length}`;
  document.getElementById('question').textContent = q.question;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt);
    opts.appendChild(btn);
  });
  document.getElementById('result').textContent = '';
}

function checkAnswer(answer) {
  const correct = questions[current].answer;
  const result = document.getElementById('result');
  if (answer === correct) {
    result.textContent = '✔️ إجابة صحيحة!';
    result.style.color = 'green';
    score++;
  } else {
    result.textContent = `❌ خطأ! الإجابة الصحيحة: ${correct}`;
    result.style.color = 'red';
  }
  current++;
  setTimeout(() => {
    if (current < questions.length) showQuestion();
    else endQuiz();
  }, 1200);
}

function endQuiz() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('score').textContent = `علامتك: ${score} من ${questions.length}`;
}
</script>

</body>
</html>
