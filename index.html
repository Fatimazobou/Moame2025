<!DOCTYPE html><html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيد ميلاد محمد 🎉</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #e0f0ff;
      color: #003366;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #005b99;
    }
    .question {
      font-size: 20px;
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #0077cc;
      color: white;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .result {
      font-size: 24px;
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>💙 عيد ميلاد سعيد يا محمد 💙</h1>
  <p>جاهز للعبة الحب؟ 😍 جاوب على الأسئلة وشوف كم تحبني 😘</p>  <div id="quiz">
    <div id="question-container" class="question"></div>
    <button onclick="answer(true)">✅ صحيح</button>
    <button onclick="answer(false)">❌ خطأ</button>
    <p id="progress"></p>
  </div>  <div id="result" class="result hidden"></div>  <audio controls autoplay loop>
    <source src="https://github.com/SalmaKass/happy-birthday-no-music/raw/main/hbd.mp3" type="audio/mpeg">
    متصفحك لا يدعم تشغيل الصوت.
  </audio>  <script>
    const questions = [
      { q: "عيد ميلادك يصادف يوم الجمعة 🎉؟", a: true },
      { q: "أنا نحب اللون الأحمر أكثر من الأزرق؟", a: false },
      { q: "أول مرة درنا ڤول على بعض كانت صدفة؟", a: true },
      { q: "العشاق ما يتخاصموش أبدًا؟", a: false },
      { q: "محمد يحب النكت أكثر من الشكولاطة؟", a: true },
      { q: "أنت دايمًا تتذكر المناسبات؟", a: true },
      { q: "أنا ننسى عيد ميلادي؟", a: false },
      { q: "الحب بلا ثقة يمشي؟", a: false },
      { q: "لو قلتلك نحبك مليون مرة... راح تمل؟", a: false },
      { q: "أول مرة قلتلي صباح الخير حسيت بفرحة؟", a: true },
      { q: "العيد معاك كان يكون أحلى لو كنا مع بعض؟", a: true },
      { q: "أنا نغار عليك شوية برك؟", a: false },
      { q: "لو قلتلك أعمللي مفاجأة، راح تفشل؟", a: false },
      { q: "العشاق ما يلعبوش كويز؟", a: false },
      { q: "أنا نحب محمد حتى في النكت التافهة؟ 😂", a: true }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      if (current < questions.length) {
        document.getElementById("question-container").innerText = questions[current].q;
        document.getElementById("progress").innerText = `السؤال ${current + 1} من ${questions.length}`;
      } else {
        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = `🥳 نتيجتك: ${score}/${questions.length}<br><br>🎂 عيد ميلاد سعيد يا محمد 🎂<br>💙 نحبك يا محمد 💙<br><br>ضحكتك عندي بالدنيا كلها 😊`;
      }
    }

    function answer(response) {
      if (response === questions[current].a) {
        score++;
      }
      current++;
      showQuestion();
    }

    showQuestion();
  </script></body>
</html>
